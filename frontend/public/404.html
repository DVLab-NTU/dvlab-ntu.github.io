    <title>DV Lab</title>
    <script>
      // GitHub Pages SPA fallback: any deep link (e.g. /members/xxx or /zh/about)

      sessionStorage.setItem('dvlab-spa-path', window.location.pathname + window.location.search)
      window.location.replace('/')
    </script>

</html>
