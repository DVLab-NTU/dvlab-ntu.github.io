name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cms: [disabled, enabled]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full verification
        run: npm run verify
        env:
          PUBLIC_SITE_URL: https://dvlab.ee.ntu.edu.tw
          CMS_GITHUB_REPO: ${{ matrix.cms == 'enabled' && 'DVLab-NTU/dvlab-ntu.github.io' || '' }}
          CMS_OAUTH_BASE_URL: ${{ matrix.cms == 'enabled' && 'https://example.com' || '' }}
